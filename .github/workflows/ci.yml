name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool install --global MacroDeck.Plugin.Cli --version 3.0.0-beta.17
      - run: dotnet build
      - run: dotnet test
      - run: macrodeck-plugin build --source src/WindsurfGauges --rid win-x64 --output ./artifacts
      - run: macrodeck-plugin validate --artifact ./artifacts/com.m-hume.windsurf-gauges-*.macroDeckPlugin
